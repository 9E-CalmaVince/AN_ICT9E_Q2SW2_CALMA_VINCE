<html>
<head>
	<meta charset="utf-8">

<body syle="background-image: url('bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 100vh;">
		<nav class="navbar navbar-dark bg-dark px-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span>Contact Us</span>
            </a>
            <form>
                <input type="search" placeholder="Search" aria-label="Search">
                <button type="submit">Search</button>
            </form>
        </div>
    </nav>


   <div class="container mt-5">
   	<div class="row">
   		<div class="col-md-7">
   		 	<table class="table table-bordered table-hover">
		<tr class="table-hover  table-warning">
			<th>Day</th>
			<th>Office Hours</th>
			<th>Department</th>
		</tr>
		<tr>
			<td>Monday</td>
			<td>8AM-4PM</td>
			<td>Register's Office</td>
	    </tr>
	    <tr>
			<td>Tuesday</td>
			<td>8AM-4PM</td>
			<td>Accounting Office</td>
	    </tr>
	    <tr>
			<td>Wednesday</td>
			<td>8AM-4PM</td>
			<td>Guidance Office</td>
	    </tr>
	    <tr>
			<td>Thursday</td>
			<td>8AM-4PM</td>
			<td>Principal's Office Office</td>
	    </tr>
	      <tr>
			<td>Friday</td>
			<td>8AM-3PM</td>
			<td>Admin Office</td>
	    </tr>
	</table>
        </div>


	<div class="col-md-7">
		<div class="bg-white p-4 ">
			<h3 class="text-center fw-normal mb-4">Contact Us</h3>
			<form>
				<div>
					<label for="fullName" class="form-label">Full Name</label>
					<input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
				</div>
				<div>
					<label for="emailAddress" class="form-label">Email Address</label>
					<input type="email" class="form-control" id="emailAddress" placeholder="Enter your email">
				</div>
				<div>
					<label for="subject" class="form-label">Subject</label>
					 <input type="text" class="form-control" id="subject" placeholder="Enter subject">
				</div>
				<div>
					<label for="message" class="form-label">Message</label>
					<textarea class="form-control" id="message" rows="4" placeholder="Type your message here"></textarea>
				</div>
				<div>
					<button type="submit" class="btn btn-primary py-2">Send Message</button>
				</div>
			</form>
		</div>
	</div>




</body>
</html>
